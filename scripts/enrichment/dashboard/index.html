<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍕 apizzamichigan Enrichment Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .card h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #94a3b8; }
    .progress-bar {
      height: 1.5rem;
      background: #334155;
      border-radius: 0.25rem;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .stat { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
    .stat:last-child { border-bottom: none; }
    .stat-label { color: #94a3b8; }
    .stat-value { font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-success { background: #10b981; color: #fff; }
    .badge-warning { background: #f59e0b; color: #fff; }
    .badge-error { background: #ef4444; color: #fff; }
    .badge-idle { background: #6b7280; color: #fff; }
    .timestamp { text-align: right; font-size: 0.875rem; color: #64748b; margin-top: 1rem; }
    .worker-list { font-size: 0.875rem; }
    .worker-item { padding: 0.5rem; background: #0f172a; border-radius: 0.25rem; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍕 apizzamichigan Enrichment Dashboard</h1>
    
    <div class="grid">
      <!-- Queue Progress -->
      <div class="card">
        <h2>Queue Progress</h2>
        <div id="queue-progress"></div>
      </div>

      <!-- Workers -->
      <div class="card">
        <h2>Workers</h2>
        <div id="workers"></div>
      </div>

      <!-- Michigan Stats -->
      <div class="card">
        <h2>Michigan Pizza Stats</h2>
        <div id="mi-stats"></div>
      </div>

      <!-- Overall Stats -->
      <div class="card">
        <h2>Overall Stats</h2>
        <div id="overall-stats"></div>
      </div>
    </div>

    <div class="timestamp">Last updated: <span id="timestamp">-</span></div>
  </div>

  <script>
    let previousData = null;

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        updateDashboard(data);
        previousData = data;
      } catch (err) {
        console.error('Failed to fetch status:', err);
      }
    }

    function updateDashboard(data) {
      // Queue Progress
      const queueHtml = ['osm_extract', 'scrape', 'classify'].map(type => {
        const t = data.queue.totals[type];
        const pct = data.queue.progress[type];
        const label = type.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
        
        return `
          <div style="margin-bottom: 1rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
              <span>${label}</span>
              <span>${t.completed.toLocaleString()} / ${t.total.toLocaleString()}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${pct}%">${pct}%</div>
            </div>
            <div style="font-size: 0.75rem; color: #64748b; margin-top: 0.25rem;">
              Pending: ${t.pending.toLocaleString()} | Processing: ${t.processing} | Failed: ${t.failed}
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('queue-progress').innerHTML = queueHtml;

      // Workers
      const activeWorkers = data.workers.active;
      const workersByType = data.workers.byType;
      const workersHtml = `
        <div class="stat">
          <span class="stat-label">Active Workers</span>
          <span class="stat-value">${activeWorkers}</span>
        </div>
        <div class="stat">
          <span class="stat-label">OSM Extract</span>
          <span class="stat-value">${workersByType.osm_extract}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Scrape</span>
          <span class="stat-value">${workersByType.scrape}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Classify</span>
          <span class="stat-value">${workersByType.classify}</span>
        </div>
      `;
      document.getElementById('workers').innerHTML = workersHtml;

      // MI Stats
      const pg = data.postgres;
      const miHtml = `
        <div class="stat">
          <span class="stat-label">Total Rows</span>
          <span class="stat-value">${pg.mi_total.toLocaleString()}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Scraped (fetch)</span>
          <span class="stat-value">${pg.mi_scraped.toLocaleString()}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Classified (style/price)</span>
          <span class="stat-value">${pg.mi_classified.toLocaleString()}</span>
        </div>
      `;
      document.getElementById('mi-stats').innerHTML = miHtml;

      // Overall Stats
      const overallHtml = `
        <div class="stat">
          <span class="stat-label">OSM Tags Populated</span>
          <span class="stat-value">${pg.osm_tags_total.toLocaleString()}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Scraped (all states)</span>
          <span class="stat-value">${pg.scraped_total.toLocaleString()}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Style Classified</span>
          <span class="stat-value">${pg.style_total.toLocaleString()}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Price Range Set</span>
          <span class="stat-value">${pg.price_range_total.toLocaleString()}</span>
        </div>
      `;
      document.getElementById('overall-stats').innerHTML = overallHtml;

      // Timestamp
      const ts = new Date(data.timestamp).toLocaleTimeString();
      document.getElementById('timestamp').textContent = ts;
    }

    // Poll every 10 seconds
    fetchStatus();
    setInterval(fetchStatus, 10000);
  </script>
</body>
</html>
