<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>apizzamichigan Enrichment Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f1419;
      color: #e0e0e0;
      padding: 20px;
      line-height: 1.6;
    }

    .header {
      margin-bottom: 30px;
      border-bottom: 2px solid #1e2731;
      padding-bottom: 15px;
    }

    h1 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8b949e;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
    }

    .card h2 {
      font-size: 18px;
      color: #fff;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h3 {
      font-size: 14px;
      color: #8b949e;
      margin: 12px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
    }

    .stat:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: #8b949e;
      font-size: 14px;
    }

    .stat-value {
      color: #fff;
      font-weight: 600;
      font-size: 16px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #238636, #2ea043);
      transition: width 0.3s ease;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: #238636;
      color: #fff;
    }

    .badge-warning {
      background: #9e6a03;
      color: #fff;
    }

    .badge-error {
      background: #da3633;
      color: #fff;
    }

    .badge-info {
      background: #1f6feb;
      color: #fff;
    }

    .activity-feed {
      max-height: 300px;
      overflow-y: auto;
      font-size: 13px;
    }

    .activity-item {
      padding: 10px;
      margin-bottom: 8px;
      background: #0d1117;
      border-radius: 6px;
      border-left: 3px solid #238636;
    }

    .activity-item.failure {
      border-left-color: #da3633;
    }

    .activity-time {
      color: #8b949e;
      font-size: 11px;
    }

    .activity-desc {
      color: #e0e0e0;
      margin: 4px 0;
    }

    .activity-error {
      color: #ff7b72;
      font-size: 11px;
      font-family: 'Courier New', monospace;
    }

    .worker-card {
      background: #0d1117;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 3px solid #238636;
    }

    .worker-card.stale {
      border-left-color: #f85149;
      opacity: 0.6;
    }

    .worker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .worker-name {
      font-size: 13px;
      color: #fff;
      font-family: 'Courier New', monospace;
    }

    .worker-stats {
      font-size: 11px;
      color: #8b949e;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table th {
      text-align: left;
      padding: 10px;
      background: #0d1117;
      color: #8b949e;
      font-weight: 600;
      border-bottom: 2px solid #21262d;
    }

    .table td {
      padding: 10px;
      border-bottom: 1px solid #21262d;
    }

    .table tr:hover {
      background: #0d1117;
    }

    .metric-big {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .metric-label {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .alert-warning {
      background: #341a00;
      border: 1px solid #9e6a03;
      color: #f0b72f;
    }

    .alert-error {
      background: #1a0000;
      border: 1px solid #da3633;
      color: #ff7b72;
    }

    .sparkline {
      display: inline-block;
      width: 60px;
      height: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0d1117;
    }

    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
      font-size: 14px;
    }

    .control-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-pause {
      background: #9e6a03;
      color: #fff;
    }

    .btn-pause:hover {
      background: #bb7b0a;
    }

    .btn-resume {
      background: #238636;
      color: #fff;
    }

    .btn-resume:hover {
      background: #2ea043;
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍕 apizzamichigan Enrichment Dashboard</h1>
    <div class="subtitle">
      Real-time pipeline monitoring • Auto-refresh every 10s •
      <span id="last-update">Loading...</span>
    </div>
  </div>

  <div id="app">
    <div class="loading">Loading dashboard...</div>
  </div>

  <script>
    let data = null;

    async function fetchData() {
      try {
        const response = await fetch('/api/status/enhanced');
        data = await response.json();
        render();
      } catch (error) {
        console.error('Failed to fetch data:', error);
        document.getElementById('app').innerHTML = `
          <div class="alert alert-error">
            Failed to load dashboard data. Retrying...
          </div>
        `;
      }
    }

    async function pauseWorker(workerType) {
      const btn = document.getElementById(`btn-${workerType}`);
      if (btn) btn.disabled = true;

      try {
        const response = await fetch(`/api/control/pause/${workerType}`, {
          method: 'POST'
        });

        if (response.ok) {
          console.log(`Paused ${workerType}`);
          await fetchData(); // Refresh immediately
        } else {
          alert(`Failed to pause ${workerType}`);
        }
      } catch (error) {
        console.error('Pause error:', error);
        alert(`Error pausing ${workerType}: ${error.message}`);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function resumeWorker(workerType) {
      const btn = document.getElementById(`btn-${workerType}`);
      if (btn) btn.disabled = true;

      try {
        const response = await fetch(`/api/control/resume/${workerType}`, {
          method: 'POST'
        });

        if (response.ok) {
          console.log(`Resumed ${workerType}`);
          await fetchData(); // Refresh immediately
        } else {
          alert(`Failed to resume ${workerType}`);
        }
      } catch (error) {
        console.error('Resume error:', error);
        alert(`Error resuming ${workerType}: ${error.message}`);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function render() {
      if (!data) return;

      const {
        queue,
        workers,
        performance,
        postgres,
        errors,
        systemHealth,
        timestamp
      } = data;

      document.getElementById('last-update').textContent =
        `Last update: ${new Date(timestamp).toLocaleTimeString()}`;

      const html = `
        <!-- TIER 1: PERFORMANCE & VELOCITY -->
        <div class="grid">
          ${renderPerformanceCard(queue, performance)}
          ${renderRecentActivity(performance)}
          ${renderWorkerHealth(workers)}
        </div>

        <!-- TIER 2: DATA QUALITY & COVERAGE -->
        <div class="grid">
          ${renderEnrichmentQuality(postgres)}
          ${renderGeographicCoverage(postgres)}
          ${renderHandoffSuccess(postgres)}
        </div>

        <!-- TIER 3: ALERTS & DIAGNOSTICS -->
        <div class="grid">
          ${renderSystemHealth(systemHealth)}
          ${renderErrorAnalysis(errors)}
          ${renderStyleDistribution(postgres)}
        </div>

        <!-- QUEUE DETAILS -->
        <div class="grid">
          ${renderQueueCard('OSM Extract', 'osm_extract', queue, performance)}
          ${renderQueueCard('Scrape', 'scrape', queue, performance)}
          ${renderQueueCard('Classify', 'classify', queue, performance)}
          ${renderQueueCard('Menu Parse (Slowlane)', 'menu_parse', queue, performance)}
        </div>

        <!-- SLOWLANE SUMMARY -->
        <div class="grid">
          ${renderSlowlaneSummary(postgres, queue)}
          ${renderRecentQAFlags(postgres)}
        </div>
      `;

      document.getElementById('app').innerHTML = html;
    }

    function renderPerformanceCard(queue, performance) {
      const rates = performance.rates;
      return `
        <div class="card">
          <h2>⚡ Processing Rate & ETA</h2>
          ${renderJobRate('OSM Extract', 'osm_extract', rates)}
          ${renderJobRate('Scrape', 'scrape', rates)}
          ${renderJobRate('Classify', 'classify', rates)}
        </div>
      `;
    }

    function renderJobRate(label, type, rates) {
      const rate = rates[type];
      const color = rate.perHour > 0 ? '#238636' : '#8b949e';
      return `
        <div class="stat">
          <div>
            <div class="stat-label">${label}</div>
            <div class="stat-value" style="color: ${color};">
              ${rate.perHour}/hr • ETA: ${rate.etaFormatted}
            </div>
          </div>
        </div>
      `;
    }

    function renderRecentActivity(performance) {
      const items = performance.recentCompletions.slice(0, 10);
      const failures = performance.recentFailures.slice(0, 5);

      return `
        <div class="card">
          <h2>📋 Recent Activity</h2>
          <h3>Last 10 Completions</h3>
          <div class="activity-feed">
            ${items.map(item => `
              <div class="activity-item">
                <div class="activity-time">${formatTime(item.completedAt)}</div>
                <div class="activity-desc">
                  <span class="badge badge-success">${item.type}</span>
                  ${item.description}
                </div>
              </div>
            `).join('')}
          </div>

          ${failures.length > 0 ? `
            <h3 style="margin-top: 16px;">Recent Failures</h3>
            <div class="activity-feed">
              ${failures.map(fail => `
                <div class="activity-item failure">
                  <div class="activity-time">${formatTime(fail.completedAt)}</div>
                  <div class="activity-desc">
                    <span class="badge badge-error">${fail.type}</span>
                    ${fail.description}
                  </div>
                  <div class="activity-error">${fail.error}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderWorkerHealth(workers) {
      const active = workers.active;
      const stale = workers.stale;

      return `
        <div class="card">
          <h2>💚 Worker Health</h2>
          <div class="stat">
            <span class="stat-label">Active Workers</span>
            <span class="stat-value">${active.length}</span>
          </div>
          ${stale.length > 0 ? `
            <div class="alert alert-warning">
              ⚠️ ${stale.length} stale worker(s) detected (heartbeat >5min)
            </div>
          ` : ''}

          <h3>Active Workers</h3>
          ${active.map(w => `
            <div class="worker-card">
              <div class="worker-header">
                <span class="worker-name">${w.worker_id.split('-').pop()}</span>
                <span class="badge badge-info">${w.agent_type}</span>
              </div>
              <div class="worker-stats">
                ✅ ${w.jobs_completed} completed • ❌ ${w.jobs_failed} failed •
                ⏱️ ${Math.round(w.uptime_minutes)}m uptime
              </div>
            </div>
          `).join('')}

          ${stale.length > 0 ? `
            <h3 style="margin-top: 12px;">Stale Workers</h3>
            ${stale.map(w => `
              <div class="worker-card stale">
                <div class="worker-header">
                  <span class="worker-name">${w.worker_id.split('-').pop()}</span>
                  <span class="badge badge-error">${w.agent_type}</span>
                </div>
                <div class="worker-stats">
                  Last heartbeat: ${Math.round(w.minutes_since_heartbeat)}min ago
                </div>
              </div>
            `).join('')}
          ` : ''}
        </div>
      `;
    }

    function renderEnrichmentQuality(postgres) {
      const overall = postgres.overall;
      const total = overall.total_places;
      const pctOSM = ((overall.osm_tags_populated / total) * 100).toFixed(1);
      const pctScraped = ((overall.scraped / total) * 100).toFixed(1);
      const pctClassified = ((overall.classified / total) * 100).toFixed(1);

      return `
        <div class="card">
          <h2>📊 Enrichment Quality</h2>

          <div class="stat">
            <span class="stat-label">Total Places</span>
            <span class="stat-value">${total.toLocaleString()}</span>
          </div>

          <h3>Data Completeness</h3>
          ${renderQualityMetric('OSM Tags', overall.osm_tags_populated, total, pctOSM)}
          ${renderQualityMetric('Scraped', overall.scraped, total, pctScraped)}
          ${renderQualityMetric('Classified', overall.classified, total, pctClassified)}
          ${renderQualityMetric('Style', overall.with_style, total, ((overall.with_style / total) * 100).toFixed(1))}
          ${renderQualityMetric('Price Range', overall.with_price_range, total, ((overall.with_price_range / total) * 100).toFixed(1))}
        </div>
      `;
    }

    function renderQualityMetric(label, count, total, pct) {
      return `
        <div style="margin-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <span class="stat-label">${label}</span>
            <span class="stat-value" style="font-size: 14px;">${count.toLocaleString()} (${pct}%)</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${pct}%;"></div>
          </div>
        </div>
      `;
    }

    function renderGeographicCoverage(postgres) {
      const top10 = postgres.geography.slice(0, 10);
      return `
        <div class="card">
          <h2>🗺️ Geographic Coverage (Top 10 States)</h2>
          <table class="table">
            <thead>
              <tr>
                <th>State</th>
                <th>Total</th>
                <th>OSM %</th>
                <th>Scraped %</th>
                <th>Classified %</th>
              </tr>
            </thead>
            <tbody>
              ${top10.map(row => `
                <tr>
                  <td><strong>${row.state || 'Unknown'}</strong></td>
                  <td>${row.total.toLocaleString()}</td>
                  <td>${row.pct_osm || 0}%</td>
                  <td>${row.pct_scraped || 0}%</td>
                  <td>${row.pct_classified || 0}%</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderHandoffSuccess(postgres) {
      const handoff = postgres.handoff;
      return `
        <div class="card">
          <h2>🔄 Handoff Success Rates</h2>
          <div class="stat">
            <span class="stat-label">OSM → Scrape Conversion</span>
            <span class="stat-value">${handoff.scrape_conversion || 0}%</span>
          </div>
          <div class="stat">
            <span class="stat-label">Scrape → Classify Conversion</span>
            <span class="stat-value">${handoff.classify_conversion || 0}%</span>
          </div>
          <div class="stat">
            <span class="stat-label">Places with Website</span>
            <span class="stat-value">${handoff.with_website.toLocaleString()}</span>
          </div>
          <div class="stat">
            <span class="stat-label">Successfully Scraped</span>
            <span class="stat-value">${handoff.scraped.toLocaleString()}</span>
          </div>
          <div class="stat">
            <span class="stat-label">Successfully Classified</span>
            <span class="stat-value">${handoff.classified.toLocaleString()}</span>
          </div>
        </div>
      `;
    }

    function renderSlowlaneSummary(postgres, queue) {
      const menu = postgres.menu || { with_menu_data: 0, total: 0 };
      const qa = postgres.qa?.stats || { total_flags: 0, flags_last_24h: 0, errors_last_24h: 0 };

      const withMenu = parseInt(menu.with_menu_data || 0, 10);
      const total = parseInt(menu.total || 0, 10);
      const pctMenu = total > 0 ? ((withMenu / total) * 100).toFixed(2) : '0.00';

      return `
        <div class="card">
          <h2>🛣️ Slowlane (Menu + QA)</h2>

          <h3>Menu Parsing Coverage</h3>
          <div class="stat">
            <span class="stat-label">Places with menu_data</span>
            <span class="stat-value">${withMenu.toLocaleString()} (${pctMenu}%)</span>
          </div>

          <h3 style="margin-top: 14px;">QA Flags</h3>
          <div class="stat">
            <span class="stat-label">Total flags</span>
            <span class="stat-value">${parseInt(qa.total_flags || 0, 10).toLocaleString()}</span>
          </div>
          <div class="stat">
            <span class="stat-label">Flags (last 24h)</span>
            <span class="stat-value">${parseInt(qa.flags_last_24h || 0, 10).toLocaleString()}</span>
          </div>
          <div class="stat">
            <span class="stat-label">Error-severity (last 24h)</span>
            <span class="stat-value">${parseInt(qa.errors_last_24h || 0, 10).toLocaleString()}</span>
          </div>

          <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #21262d;">
            <div class="stat-label">Tip</div>
            <div class="stat-value" style="font-size: 13px; font-weight: 500; color: #8b949e;">
              Menu parsing runs via JambaMini every 20s (Haiku fallback on low confidence).
            </div>
          </div>
        </div>
      `;
    }

    function renderRecentQAFlags(postgres) {
      const recent = postgres.qa?.recent || [];

      return `
        <div class="card">
          <h2>🧪 Recent QA Flags</h2>
          ${recent.length === 0 ? `
            <div class="stat-label">No flags yet.</div>
          ` : `
            <div class="activity-feed">
              ${recent.map(f => `
                <div class="activity-item ${f.severity === 'error' ? 'failure' : ''}">
                  <div class="activity-time">${formatTime(f.created_at)}</div>
                  <div class="activity-desc">
                    <span class="badge ${f.severity === 'error' ? 'badge-error' : (f.severity === 'warn' ? 'badge-warning' : 'badge-info')}">${f.flag_type}</span>
                    Place #${f.place_id}
                  </div>
                  <div class="activity-error" style="color:#8b949e;">${escapeHtml(f.message)}</div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderSystemHealth(health) {
      if (!health || health.error) {
        return `
          <div class="card">
            <h2>🖥️ System Health</h2>
            <div class="alert alert-warning">
              Unable to fetch system metrics
            </div>
          </div>
        `;
      }

      const alerts = [];
      if (health.cpu.pressure) alerts.push('⚠️ High CPU pressure');
      if (health.memory.pressure) alerts.push('⚠️ High memory pressure');
      if (health.load['1min'] > 8) alerts.push('⚠️ High system load');

      return `
        <div class="card">
          <h2>🖥️ System Health</h2>

          ${alerts.length > 0 ? `
            <div class="alert alert-warning">
              ${alerts.join(' • ')}
            </div>
          ` : ''}

          <div class="stat">
            <span class="stat-label">Load Average</span>
            <span class="stat-value">
              ${health.load['1min'].toFixed(2)} /
              ${health.load['5min'].toFixed(2)} /
              ${health.load['15min'].toFixed(2)}
            </span>
          </div>

          <div class="stat">
            <span class="stat-label">CPU Idle</span>
            <span class="stat-value">${health.cpu.idle.toFixed(1)}%</span>
          </div>

          <div class="stat">
            <span class="stat-label">Memory Usage</span>
            <span class="stat-value">
              ${health.memory.usedGB.toFixed(1)}GB / ${health.memory.totalGB.toFixed(1)}GB
              (${health.memory.usedPct.toFixed(1)}%)
            </span>
          </div>
        </div>
      `;
    }

    function renderErrorAnalysis(errors) {
      const topErrors = errors.topErrors || [];
      return `
        <div class="card">
          <h2>🚨 Error Analysis</h2>

          ${errors.nearMaxAttempts > 0 ? `
            <div class="alert alert-error">
              ⚠️ ${errors.nearMaxAttempts} job(s) near max retry attempts
            </div>
          ` : ''}

          <h3>Top Error Types</h3>
          ${topErrors.length > 0 ? `
            ${topErrors.map(err => `
              <div class="stat">
                <span class="stat-label" style="max-width: 70%; overflow: hidden; text-overflow: ellipsis;">
                  ${err.last_error || 'Unknown'}
                </span>
                <span class="stat-value">${err.count}</span>
              </div>
            `).join('')}
          ` : '<div class="stat-label">No errors 🎉</div>'}
        </div>
      `;
    }

    function renderStyleDistribution(postgres) {
      const styles = postgres.styles.slice(0, 10);
      const total = styles.reduce((sum, s) => sum + s.count, 0);

      return `
        <div class="card">
          <h2>🍕 Style Distribution (Top 10)</h2>
          ${styles.map(s => {
            const pct = ((s.count / total) * 100).toFixed(1);
            return `
              <div style="margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                  <span class="stat-label">${s.style}</span>
                  <span class="stat-value" style="font-size: 14px;">${s.count} (${pct}%)</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${pct}%;"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderQueueCard(title, type, queue, performance) {
      const totals = queue.totals[type] || { pending: 0, processing: 0, completed: 0, failed: 0, total: 0 };
      const progress = queue.progress[type] || 0;
      const rate = performance.rates[type] || { perHour: 0, perMinute: 0, etaHours: null, etaFormatted: 'N/A' };
      const isPaused = queue.paused ? !!queue.paused[type] : false;

      return `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">${title}</h2>
            <button
              class="control-btn ${isPaused ? 'btn-resume' : 'btn-pause'}"
              onclick="${isPaused ? 'resume' : 'pause'}Worker('${type}')"
              id="btn-${type}">
              ${isPaused ? '▶️ Resume' : '⏸️ Pause'}
            </button>
          </div>

          ${isPaused ? `
            <div class="alert alert-warning" style="margin-bottom: 12px;">
              ⏸️ Worker paused
            </div>
          ` : ''}

          <div class="metric-big">${progress}%</div>
          <div class="metric-label">Complete</div>

          <div class="progress-bar" style="margin: 12px 0;">
            <div class="progress-fill" style="width: ${progress}%;"></div>
          </div>

          <div class="stat">
            <span class="stat-label">Completed</span>
            <span class="stat-value">${totals.completed.toLocaleString()}</span>
          </div>
          <div class="stat">
            <span class="stat-label">Pending</span>
            <span class="stat-value">${totals.pending.toLocaleString()}</span>
          </div>
          <div class="stat">
            <span class="stat-label">Processing</span>
            <span class="stat-value">${totals.processing.toLocaleString()}</span>
          </div>
          ${totals.failed > 0 ? `
            <div class="stat">
              <span class="stat-label">Failed</span>
              <span class="stat-value" style="color: #ff7b72;">${totals.failed.toLocaleString()}</span>
            </div>
          ` : ''}

          <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #21262d;">
            <div class="stat-label">Processing Rate</div>
            <div class="stat-value" style="font-size: 14px;">
              ${isPaused ? 'Paused' : `${rate.perHour}/hr (${rate.perMinute}/min)`}
            </div>
            ${!isPaused && rate.etaHours ? `
              <div class="stat-label" style="margin-top: 4px;">
                ETA: ${rate.etaFormatted}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatTime(timestamp) {
      if (!timestamp) return 'N/A';
      const date = new Date(timestamp);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);

      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return date.toLocaleString();
    }

    // Initial fetch
    fetchData();

    // Auto-refresh every 10 seconds
    setInterval(fetchData, 10000);
  </script>
</body>
</html>
