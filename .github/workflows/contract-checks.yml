name: Contract checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify data contracts
        run: |
          npm run verify:canonical-contract
          npm run verify:sync-contract
          node scripts/ops/verify-source-contract-docs.mjs
          node scripts/ops/verify-source-promotion-policy.mjs
          node scripts/ops/verify-source-input-adapters.mjs
          node scripts/ops/verify-source-review-workflow.mjs

      - name: Verify frontend quality
        run: |
          npm run typecheck
          npm run lint -- --quiet
          CI=true npm test -- --watchAll=false --runInBand
