name: Contract checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository hygiene
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi
          npm run audit:public

      - name: Verify data and operations contracts
        run: |
          npm run verify:release
          node scripts/ops/verify-source-promotion-policy.mjs
          node scripts/ops/verify-source-input-adapters.mjs
          node scripts/ops/verify-source-review-workflow.mjs
          npm run test:ops

      - name: Verify frontend quality
        run: |
          npm run typecheck
          npm run lint -- --quiet
          CI=true npm test -- --watchAll=false --runInBand
