<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Whole tortilla marker">
  <title>Whole Tortilla Marker</title>
  <defs>
    <!-- Bright golden masa tones -->
    <linearGradient id="masa" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeb7a"/>
      <stop offset="100%" stop-color="#f6cf4f"/>
    </linearGradient>
  </defs>

  <!-- Main tortilla base -->
  <circle
    cx="32" cy="32" r="28"
    fill="url(#masa)"
    stroke="#f2cc5c"
    stroke-width="0.6"
  />

  <!-- Large toasted spots (few, evenly spaced) -->
  <g fill="#d4a94b" opacity="0.55">
    <ellipse cx="20" cy="20" rx="5.5" ry="3.5" transform="rotate(-10 20 20)" />
    <ellipse cx="44" cy="20" rx="5.2" ry="3.2" transform="rotate(12 44 20)" />
    <ellipse cx="24" cy="38" rx="5.0" ry="3.4" transform="rotate(6 24 38)" />
    <ellipse cx="40" cy="40" rx="5.2" ry="3.5" transform="rotate(-8 40 40)" />
    <ellipse cx="32" cy="28" rx="5.8" ry="3.8" transform="rotate(15 32 28)" />
  </g>

  <!-- Edge imperfections -->
  <path d="M13 34 q1.8 1.2 0.3 2.8 q-1.3 -0.5 -1.5 -1.7 z" fill="#f6d665" opacity="0.6"/>
  <path d="M51 30 q-1.6 1.2 -0.1 2.8 q1.3 -0.4 1.5 -1.6 z" fill="#f6d665" opacity="0.6"/>
</svg>